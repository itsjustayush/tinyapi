<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Note API</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f9f9f9; margin: 8px 0; padding: 12px; border-radius: 6px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>My Notes</h1>
    
    <textarea id="noteInput" placeholder="Write a new note here..."></textarea>
    <button onclick="addNote()">Save Note</button>

    <h2>Saved Notes</h2>
    <ul id="notesList"></ul>

    <script>
        // Fetch notes from the API and display them
        async function fetchNotes() {
            const response = await fetch('/api/notes');
            const data = await response.json();
            const list = document.getElementById('notesList');
            list.innerHTML = '';
            
            data.notes.forEach(note => {
                const li = document.createElement('li');
                li.textContent = note;
                list.appendChild(li);
            });
        }

        // Send a new note to the API
        async function addNote() {
            const noteInput = document.getElementById('noteInput');
            const noteText = noteInput.value.trim();
            
            if (!noteText) return alert("Please enter a note!");

            const response = await fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ note: noteText })
            });

            if (response.ok) {
                noteInput.value = '';
                fetchNotes(); // Refresh the list
            }
        }

        // Load notes on startup
        fetchNotes();
    </script>
</body>
</html>
