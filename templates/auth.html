<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — MeteorBase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#050507;--panel:#111117;--line:rgba(255,255,255,.12);--text:#f4f3f9;--muted:#9296a4;--violet:#b9a7ff;--cyan:#73e7ff;--mono:"DM Mono",monospace;--display:"Space Grotesk",sans-serif;--body:"Manrope",sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 70% 10%,rgba(185,167,255,.13),transparent 35%),var(--bg);color:var(--text);font-family:var(--body);display:grid;place-items:center;padding:24px}.grid{position:fixed;inset:0;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(to bottom,black,transparent)}.card{position:relative;width:min(100%,460px);padding:36px;border:1px solid var(--line);border-radius:15px;background:rgba(17,17,23,.86);box-shadow:0 30px 100px rgba(0,0,0,.4);backdrop-filter:blur(18px)}.brand{display:flex;gap:10px;align-items:center;font:700 17px var(--display);letter-spacing:-.04em}.mark{display:grid;place-items:center;width:28px;height:28px;color:var(--violet);border:1px solid rgba(185,167,255,.7);border-radius:9px}.mark svg{width:18px}.intro{margin:40px 0 27px}.intro small{color:var(--cyan);text-transform:uppercase;letter-spacing:.16em;font:11px var(--mono)}h1{margin-top:12px;font:600 38px/1.05 var(--display);letter-spacing:-.06em}.intro p{margin-top:12px;color:var(--muted);font-size:14px;line-height:1.65}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:22px;border-bottom:1px solid var(--line)}.tab{padding:12px 0;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;font:11px var(--mono);letter-spacing:.1em}.tab.active{color:var(--text);border-color:var(--violet)}.field{display:block;margin-top:15px;color:var(--muted);font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em}.field input{display:block;width:100%;height:46px;margin-top:8px;padding:0 13px;border:1px solid var(--line);border-radius:7px;outline:0;background:rgba(255,255,255,.04);color:var(--text);font:14px var(--body)}.field input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(185,167,255,.12)}button.primary,.google{width:100%;height:46px;border-radius:7px;cursor:pointer;font-weight:700}button.primary{margin-top:22px;border:1px solid #ddd6ff;background:linear-gradient(135deg,#f4f1ff,#bca9ff);color:#16121f}.google{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text)}button:hover{filter:brightness(1.08)}.divider{display:flex;align-items:center;gap:12px;margin:21px 0;color:var(--muted);font:10px var(--mono)}.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}.status{min-height:18px;margin-top:15px;color:var(--muted);font-size:12px}.status.error{color:#ff9f9a}.status.success{color:var(--cyan)}.foot{margin-top:28px;text-align:center;color:var(--muted);font:11px var(--mono)}.foot a{color:var(--violet)}.hidden{display:none!important}@media(max-width:500px){.card{padding:28px 22px}}
  </style>
</head>
<body><div class="grid"></div><main class="card"><a class="brand" href="/"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 4.5v15M17 4.5v15M7 8.5h10M7 15.5h10"/><circle cx="7" cy="4" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg></span>METEORBASE</a><section class="intro"><small>Access the control plane</small><h1>One identity.<br>Every service.</h1><p>Use your MeteorBase account to create client keys, connect microservices, and manage the gateway.</p></section><div class="tabs"><button class="tab active" id="signinTab">SIGN IN</button><button class="tab" id="signupTab">CREATE ACCOUNT</button></div><form id="authForm"><label class="field">Email<input id="email" type="email" autocomplete="email" placeholder="you@company.com" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required></label><button class="primary" id="submitBtn" type="submit">Continue to console ↗</button></form><div class="divider">OR</div><button class="google" id="googleBtn" type="button"><span style="color:#73e7ff">◉</span> Continue with Google</button><div class="status" id="status" aria-live="polite"></div><div class="foot"><a href="/">← Back to landing</a></div></main>
<script>
const supabase = window.supabase.createClient({{ supabase_url|tojson }}, {{ supabase_key|tojson }});
let mode = 'signin';
const statusEl = document.getElementById('status');
function status(message, kind=''){ statusEl.textContent=message; statusEl.className='status '+kind; }
function setMode(next){ mode=next; document.getElementById('signinTab').classList.toggle('active',next==='signin'); document.getElementById('signupTab').classList.toggle('active',next==='signup'); document.getElementById('submitBtn').textContent=next==='signin'?'Continue to console ↗':'Create your account ↗'; status(''); }
document.getElementById('signinTab').onclick=()=>setMode('signin'); document.getElementById('signupTab').onclick=()=>setMode('signup');
document.getElementById('authForm').addEventListener('submit', async (event)=>{ event.preventDefault(); const email=document.getElementById('email').value.trim(); const password=document.getElementById('password').value; status('Authenticating…'); const result=mode==='signin'?await supabase.auth.signInWithPassword({email,password}):await supabase.auth.signUp({email,password}); if(result.error){status(result.error.message,'error');return} if(mode==='signup'&&!result.data.session){status('Check your email to confirm the account.','success');return} window.location.href='/dashboard'; });
document.getElementById('googleBtn').onclick=async()=>{ status('Opening Google…'); const {error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/auth/callback'}}); if(error)status(error.message,'error'); };
(async()=>{ const {data}=await supabase.auth.getSession(); if(data.session)window.location.href='/dashboard'; })();
</script></body></html>
