<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CORE BRAIN - Authentication</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#cbc3d7",
                        "primary": "#d0bcff",
                        "surface": "#131313",
                        "on-surface": "#e5e2e1",
                        "secondary": "#5de6ff",
                        "surface-container-low": "#1c1b1b",
                        "outline-variant": "#494454",
                        "error": "#ffb4ab"
                    },
                    "fontFamily": {
                        "label-caps": ["Space Mono"],
                        "code-md": ["Space Mono"],
                        "body-md": ["Sora"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "code-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
        }

        .glass-panel {
            background: rgba(19, 19, 19, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neon-glow-primary {
            box-shadow: 0 0 15px rgba(208, 188, 255, 0.2);
        }

        .neon-glow-primary:hover {
            box-shadow: 0 0 25px rgba(208, 188, 255, 0.4);
        }

        .neon-glow-secondary {
            box-shadow: 0 0 15px rgba(93, 230, 255, 0.2);
        }

        .neon-glow-secondary:hover {
            box-shadow: 0 0 25px rgba(93, 230, 255, 0.4);
        }

        .brutalist-border {
            border: 2px solid theme('colors.outline-variant');
        }

        .cyan-text-glow {
            text-shadow: 0 0 10px rgba(93, 230, 255, 0.5);
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px rgba(26, 26, 26, 0.8) inset !important;
            -webkit-text-fill-color: theme('colors.on-surface') !important;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative font-body-md text-body-md overflow-x-hidden">
    <div class="noise-overlay"></div>

    <div class="fixed inset-0 -z-10">
        <div class="absolute inset-0 bg-gradient-to-br from-primary/10 via-surface to-secondary/10 animate-pulse"></div>
    </div>

    <div class="w-full max-w-md px-6 relative z-10">
        <div class="text-center mb-12">
            <h1 class="font-headline-lg text-3xl text-primary tracking-tighter mb-2 cyan-text-glow">CORE BRAIN</h1>
            <p class="font-code-md text-code-md text-on-surface-variant">Terminal Operations Authentication</p>
        </div>

        <div class="glass-panel brutalist-border p-8 rounded-xl neon-glow-primary">
            <div class="flex gap-4 mb-8 border-b border-outline-variant/30 pb-4">
                <button id="loginTab" class="flex-1 py-2 font-label-caps text-label-caps text-primary border-b-2 border-primary transition-colors">
                    SIGN IN
                </button>
                <button id="signupTab" class="flex-1 py-2 font-label-caps text-label-caps text-on-surface-variant border-b-2 border-transparent hover:text-on-surface transition-colors">
                    SIGN UP
                </button>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">EMAIL</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" class="w-full bg-surface-container-low border border-outline-variant/50 rounded px-4 py-3 text-on-surface font-code-md text-code-md focus:border-secondary focus:outline-none transition-colors" required/>
                </div>

                <div>
                    <label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">PASSWORD</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-surface-container-low border border-outline-variant/50 rounded px-4 py-3 text-on-surface font-code-md text-code-md focus:border-secondary focus:outline-none transition-colors" required/>
                </div>

                <button type="submit" class="w-full bg-primary text-on-surface font-label-caps text-label-caps py-3 rounded hover:bg-primary/90 transition-colors neon-glow-primary active:scale-95">
                    AUTHENTICATE
                </button>
            </form>

            <form id="signupForm" class="space-y-6 hidden">
                <div>
                    <label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">EMAIL</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" class="w-full bg-surface-container-low border border-outline-variant/50 rounded px-4 py-3 text-on-surface font-code-md text-code-md focus:border-secondary focus:outline-none transition-colors" required/>
                </div>

                <div>
                    <label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">PASSWORD</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" class="w-full bg-surface-container-low border border-outline-variant/50 rounded px-4 py-3 text-on-surface font-code-md text-code-md focus:border-secondary focus:outline-none transition-colors" required/>
                </div>

                <div>
                    <label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">CONFIRM PASSWORD</label>
                    <input type="password" id="signupPasswordConfirm" placeholder="••••••••" class="w-full bg-surface-container-low border border-outline-variant/50 rounded px-4 py-3 text-on-surface font-code-md text-code-md focus:border-secondary focus:outline-none transition-colors" required/>
                </div>

                <button type="submit" class="w-full bg-secondary text-surface font-label-caps text-label-caps py-3 rounded hover:bg-secondary/90 transition-colors neon-glow-secondary active:scale-95">
                    CREATE ACCOUNT
                </button>
            </form>

            <div class="flex items-center my-6">
                <div class="flex-1 border-t border-outline-variant/30"></div>
                <span class="px-3 font-code-md text-code-md text-on-surface-variant text-[12px]">OR CONTINUE WITH</span>
                <div class="flex-1 border-t border-outline-variant/30"></div>
            </div>

            <div class="space-y-3">
                <button type="button" id="googleBtn" class="w-full border border-outline-variant/50 text-on-surface font-label-caps text-label-caps py-3 rounded hover:border-secondary hover:bg-secondary/10 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    GOOGLE
                </button>

                <button type="button" id="githubBtn" class="w-full border border-outline-variant/50 text-on-surface font-label-caps text-label-caps py-3 rounded hover:border-secondary hover:bg-secondary/10 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    GITHUB
                </button>

                <button type="button" id="otpBtn" class="w-full border border-outline-variant/50 text-on-surface font-label-caps text-label-caps py-3 rounded hover:border-secondary hover:bg-secondary/10 transition-colors flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">mail</span>
                    EMAIL OTP
                </button>
            </div>

            <div id="errorMsg" class="mt-4 p-3 bg-error/20 border border-error rounded text-error font-code-md text-code-md hidden"></div>
        </div>

        <div class="text-center mt-6">
            <p class="font-code-md text-code-md text-on-surface-variant">
                <a href="/" class="text-primary hover:text-secondary transition-colors">← Back to Landing Page</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0"></script>
    
    <script>
        const SUPABASE_URL = '{{ supabase_url }}';
        const SUPABASE_ANON_KEY = '{{ supabase_key }}';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMsg');

        loginTab.addEventListener('click', () => {
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            loginTab.classList.add('text-primary', 'border-primary');
            loginTab.classList.remove('text-on-surface-variant', 'border-transparent');
            signupTab.classList.remove('text-primary', 'border-primary');
            signupTab.classList.add('text-on-surface-variant', 'border-transparent');
            errorMsg.classList.add('hidden');
        });

        signupTab.addEventListener('click', () => {
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            signupTab.classList.add('text-primary', 'border-primary');
            signupTab.classList.remove('text-on-surface-variant', 'border-transparent');
            loginTab.classList.remove('text-primary', 'border-primary');
            loginTab.classList.add('text-on-surface-variant', 'border-transparent');
            errorMsg.classList.add('hidden');
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                window.location.href = '/dashboard';
            } catch (err) {
                showError(`Login failed: ${err.message}`);
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

            if (password !== passwordConfirm) {
                showError('Passwords do not match');
                return;
            }

            try {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) throw error;
                showError('Account created! Check your email to confirm.');
                signupForm.reset();
            } catch (err) {
                showError(`Signup failed: ${err.message}`);
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: `${window.location.origin}/auth/callback` }
                });
                if (error) throw error;
            } catch (err) {
                showError(`Google auth failed: ${err.message}`);
            }
        });

        document.getElementById('githubBtn').addEventListener('click', async () => {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'github',
                    options: { redirectTo: `${window.location.origin}/auth/callback` }
                });
                if (error) throw error;
            } catch (err) {
                showError(`GitHub auth failed: ${err.message}`);
            }
        });

        document.getElementById('otpBtn').addEventListener('click', async () => {
            const email = prompt('Enter your email for OTP:');
            if (!email) return;

            try {
                const { data, error } = await supabase.auth.signInWithOtp({ email });
                if (error) throw error;
                showError('Check your email for the OTP link!');
            } catch (err) {
                showError(`OTP failed: ${err.message}`);
            }
        });

        supabase.auth.onAuthStateChange((event, session) => {
            if (session && event === 'SIGNED_IN') {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
